module_name: Roboclaw Driver
serial_config:
  - command: roboclaw start ${SERIAL_DEV} RBCLW_BAUD
    port_config_param:
      name: RBCLW_SER_CFG
      group: Roboclaw

actuator_output:
  output_groups:
    - param_prefix: RBCLW
      channel_label: 'Channel'
      standard_params:
        disarmed: { min: 128, max: 128, default: 128 }
        min: { min: 1, max: 128, default: 1 }
        max: { min: 128, max: 256, default: 256 }
        failsafe: { min: 0, max: 257 }
      num_channels: 2

parameters:
  - group: Roboclaw Driver
    definitions:
      RBCLW_BAUD:
        description:
          short: RoboClaw packet serial baud rate
          long: Baud rate selected for RoboClaw packet serial communication. This value must match the baud rate configured in BasicMicro Motion Studio.
        type: enum
        default: 115200
        reboot_required: true
        values:
          2400: '2400'
          9600: '9600'
          19200: '19200'
          38400: '38400'
          57600: '57600'
          115200: '115200'
          230400: '230400'
          460800: '460800'

      RBCLW_COUNTS_REV:
        description:
          short: Number of encoder counts for one wheel revolution
          long: The default value of 1200 corresponds to the default configuration of the Aion R1 rover.
        type: int32
        default: 1200
        min: 1
      RBCLW_VEL_CTRL:
        description:
          short: Rear-encoder side velocity control
          long: |
            0 keeps the existing open-loop RoboClaw command path.
            1 uses RoboClaw signed-speed closed-loop control. The rear-right
            encoder regulates the complete right-side motor pair and the
            rear-left encoder regulates the complete left-side motor pair.
            This assumes each RoboClaw channel powers the front and rear motor
            on the same side. It is not independent four-wheel traction control.
        type: int32
        default: 0
        min: 0
        max: 1

      RBCLW_QPPS_MAX:
        description:
          short: Full-command side speed in encoder counts per second
          long: |
            Maps normalized PX4 side command [-1, 1] to the RoboClaw signed
            speed target. Calibrate this using the rear wheel encoder and
            BasicMicro Motion Studio. A value of 0 forces stop when
            RBCLW_VEL_CTRL is enabled.
        type: int32
        default: 0
        min: 0
        max: 2000000

      RBCLW_ENC_HZ:
        description:
          short: Rear encoder polling and publication rate
          long: |
            Polls the two RoboClaw encoder channels and publishes wheel_encoders.
            0 disables polling. Start with 20 Hz for EKF2/tuning and increase
            only after checking serial load.
        type: int32
        default: 0
        min: 0
        max: 100

      RBCLW_ADDRESS:
        description:
          short: Address of the ESC on the bus
          long: The ESC has to be configured to have an address from 0x80 to 0x87. This parameter needs to match the configured value.
        type: enum
        default: 128
        min: 128
        max: 135
        values:
          128: '0x80'
          129: '0x81'
          130: '0x82'
          131: '0x83'
          132: '0x84'
          133: '0x85'
          134: '0x86'
          135: '0x87'
